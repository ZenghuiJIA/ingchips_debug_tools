[package]
name = "hil-runtime"
version = "1.3.3"
edition = "2021"

[dependencies]
hil-debug-core = { path = "../debug-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.7"
regex = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sysinfo = "0.33"
object = { version = "0.36", features = ["read"] }
roxmltree = "0.20"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
fs2 = "0.4"
addr2line = "0.24"

[[bin]]
name = "hil-native"
path = "src/main.rs"
