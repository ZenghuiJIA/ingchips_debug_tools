name: Signed Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to build'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-2022
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.IDEA_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Resolve release tag
        id: release
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Expected vX.Y.Z tag, got $tag" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
          "notes_file=docs/RELEASE_NOTES_${tag}.md" >> $env:GITHUB_OUTPUT

      - name: Check updater signing key
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY (or IDEA_KEY) secret is required for signed updater releases."
          }

      - name: Checkout tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-daemon.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -r requirements-daemon.txt

      - name: Validate tag, versions, release notes & publish plan
        run: |
          python scripts/verify_release_version.py '${{ steps.release.outputs.tag }}'
          python scripts/test_release_plan.py

      - name: Frontend production regression
        run: node scripts/verify_features_regression.js

      - name: Build native runtime & Python worker
        env:
          MCP_SERVER_VERSION: ${{ steps.release.outputs.version }}
        run: python scripts/build_daemon_windows.py --daemon-only

      - name: Rust check & workspace tests
        working-directory: src-tauri
        run: |
          cargo check --locked
          cargo test --locked --workspace --lib

      - name: Backend and native regression
        run: python scripts/verify_backend_regression.py --native build_dist/hil-native.exe

      - name: Build signed Tauri desktop & NSIS updater
        run: pnpm tauri build

      - name: Package portable ZIP, latest.json & release-manifest.json
        env:
          SKIP_BUILD: '1'
        run: python scripts/package_release.py '${{ steps.release.outputs.tag }}'

      - name: Verify signed installer against embedded public key & ZIP checksums
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml signed_release_matches_embedded_key_and_rejects_tampering -- --ignored
          python scripts/verify_release.py "release/AI-HIL-Debugger-${{ steps.release.outputs.tag }}-windows-x64.zip"

      - name: Upload workflow release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-HIL-Debugger-${{ steps.release.outputs.tag }}-windows-x64
          path: |
            release/AI-HIL-Debugger-${{ steps.release.outputs.tag }}-windows-x64.zip
            release/AI-HIL-Debugger-setup.exe
            release/AI-HIL-Debugger-setup.exe.sig
            release/latest.json
            release/release-manifest.json
          if-no-files-found: error

      - name: Publish verified GitHub Release atomically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NOTES_FILE: ${{ steps.release.outputs.notes_file }}
        run: python scripts/publish_release.py
