name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to build'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-2022
    env:
      # Optional Tauri updater key. The current project publishes NSIS/MSI installers;
      # do not put a filesystem path here, put the key file contents in the secret.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.IDEA_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Resolve release tag
        id: release
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Expected vX.Y.Z tag, got $tag" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Checkout tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          # No requirements.txt/pyproject.toml exists; dependency installation is explicit below.
          # Do not enable setup-python pip caching here, because the action requires a dependency file.

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install daemon build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pyocd cmsis-pack-manager pylink-square pyelftools capstone pyserial intelhex pyyaml psutil

      - name: Validate tag, versions, and functional release notes
        run: python scripts/verify_release_version.py '${{ steps.release.outputs.tag }}'

      - name: Frontend production regression
        run: node scripts/verify_features_regression.js

      - name: Frontend build
        run: pnpm build

      - name: Build native runtime for Tauri external-bin checks
        env:
          MCP_SERVER_VERSION: ${{ steps.release.outputs.version }}
        run: python scripts/build_daemon_windows.py --daemon-only

      - name: Rust check and workspace tests
        working-directory: src-tauri
        run: |
          cargo check --locked
          cargo test --locked --workspace --lib

      - name: Backend and native regression
        run: python scripts/verify_backend_regression.py --native build_dist/hil-native.exe

      - name: Build and package Windows release
        env:
          MCP_SERVER_VERSION: ${{ steps.release.outputs.version }}
        run: python scripts/package_release.py '${{ steps.release.outputs.tag }}'

      - name: Verify release archive
        run: python scripts/verify_release.py "release/AI-HIL-Debugger-${{ steps.release.outputs.tag }}-windows-x64.zip"

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: AI-HIL Debugger ${{ steps.release.outputs.tag }}
          body_path: docs/RELEASE_NOTES_${{ steps.release.outputs.tag }}.md
          files: |
            release/AI-HIL-Debugger-${{ steps.release.outputs.tag }}-windows-x64.zip
            release/AI-HIL-Debugger-${{ steps.release.outputs.tag }}-windows-x64/installers/*.exe
            release/AI-HIL-Debugger-${{ steps.release.outputs.tag }}-windows-x64/installers/*.msi
          fail_on_unmatched_files: true
          generate_release_notes: false
